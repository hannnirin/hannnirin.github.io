<!DOCTYPE html>
<html lang="en" class="w-full h-full" id="port-superwrapper">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width" />

    <!-- Page-specific og:/twitter: tags live in each route's <svelte:head>. Do not duplicate them
         here: the head placeholder below renders after this block, and scrapers use the first
         occurrence of a property, so anything set here would override every page. -->
    <meta property="twitter:card" content="summary_large_image" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="">
    <div class="port-wrapper relative z-20 w-full h-full" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
